# XcodeGen spec — on a Mac: `brew install xcodegen && xcodegen generate`
# Then wire ResearchKit: `./scripts/bootstrap-researchkit.sh` (or
# `python3 scripts/wire_researchkit_xcodeproj.py` if Vendor/ already cloned).

name: XiallaStudies
options:
  bundleIdPrefix: com.xialla
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: "" # set in Xcode

targets:
  XiallaStudies:
    type: application
    platform: iOS
    sources:
      - path: XiallaStudies
        excludes:
          - Resources/Fonts/README.md
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xialla.studies
        INFOPLIST_FILE: XiallaStudies/Supporting/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
    info:
      path: XiallaStudies/Supporting/Info.plist
    # Prefer scripts/wire_researchkit_xcodeproj.py after bootstrap.
    # Manual XcodeGen alternative once Vendor/ResearchKit exists:
    # dependencies:
    #   - target: ResearchKit/ResearchKit
    #     embed: true
    #   - target: ResearchKit/ResearchKitUI
    #     embed: true

  XiallaStudiesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: XiallaStudiesTests
    dependencies:
      - target: XiallaStudies
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xialla.studies.tests
        GENERATE_INFOPLIST_FILE: true

schemes:
  XiallaStudies:
    build:
      targets:
        XiallaStudies: all
        XiallaStudiesTests: [test]
    test:
      targets:
        - XiallaStudiesTests
    run:
      config: Debug
